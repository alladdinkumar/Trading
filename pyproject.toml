[project]
name = "trading"
version = "0.1.0"
description = "AI-assisted trading & portfolio intelligence for the Indian market"
readme = "README.md"
# Pinned to 3.11 only: `ta` and other deps currently lack reliable 3.12 wheels
# on Windows. Revisit when Phase 4 (technical indicators) confirms 3.12 works.
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Sandeep Kumar" }]

dependencies = [
    # --- Data & numerics ---
    "pandas>=2.2",
    "polars>=0.20",
    "pyarrow>=15",
    "numpy>=1.26",
    "ta>=0.11.0",                # technical-indicator library (replaces unmaintained pandas-ta)

    # --- Sources ---
    "kiteconnect>=5.0",
    "yfinance>=0.2.40",
    "nsepython>=2.95",
    "feedparser>=6.0",
    "requests>=2.31",
    "requests-cache>=1.2",

    # --- ML / sentiment ---
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "transformers>=4.40",
    "torch>=2.2",

    # NOTE: no backtest or LLM-SDK packages here by design.
    # - Backtesting is a hand-rolled event loop (Phase 7 deviation), not vectorbt.
    # - The analyst/LLM layer runs via Claude Code skills (Phase 12 deviation),
    #   not the `anthropic` SDK. Both were dropped per finding F-001.

    # --- UI ---
    "streamlit>=1.35",
    "plotly>=5.20",

    # --- Utilities ---
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",
    "plyer>=2.1",                # cross-platform notifications (Windows toast)
    "pydantic>=2.7",
]

[project.scripts]
# trading.cli is added in Phase 5; running `uv run trading` before then errors.
trading = "trading.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "syrupy>=4.6",
    "freezegun>=1.5",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "Research"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line too long (formatter handles it)
    "RUF002",  # ambiguous unicode in docstrings — we use ×/− deliberately
    "RUF003",  # same, for comments
]

[tool.ruff.lint.per-file-ignores]
# Streamlit multipage convention requires numbered prefixes on filenames
# (e.g. `pages/1_Kite_Portfolio.py`) — N999 would reject those. The entry point
# is `Home.py` (capitalised — Streamlit uses the filename as the sidebar
# label), which also fails N999's snake_case rule.
"src/trading/ui/pages/*.py" = ["N999"]
"src/trading/ui/Home.py" = ["N999"]
# X / y are universal ML conventions for the feature matrix and label
# vector; Phase 16 modules + their tests use them throughout.
"src/trading/ranking/ranker_train.py" = ["N803", "N806"]
"src/trading/ranking/ranker.py" = ["N806"]
"src/trading/cli.py" = ["N806"]
"tests/test_ranker*.py" = ["N806"]
"tests/test_model_registry.py" = ["N806"]
"tests/test_cli_ranker.py" = ["N806"]
"tests/test_jobs_pre_open.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict on src/trading, lax on tests
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/trading"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that hit live external APIs (Kite, news) — excluded from CI",
    "integration: end-to-end tests using cached fixtures",
    "slow: tests >5s — excluded from default run",
]

# ---------------------------------------------------------------------------
# import-linter — automated dependency-layering enforcement (F-009)
# ---------------------------------------------------------------------------
# Mirrors the L0–L6 layer model in docs/architecture/01-architecture.md §1.
# Higher layers may import lower; a lower layer importing a higher one fails.
# Siblings joined by " | " are independent — they may NOT import each other.
# Ordering reflects the *actual* import DAG after F-006/7/8:
#   - data > store (data.ohlcv_refresh/reconcile persist via store; store is
#     DTO-neutral via trading.domain, so it no longer imports data — F-006);
#   - ranking > backtest > strategy (ranker* moved out of strategy — F-008);
#   - ops + domain + clock + config are the foundation leaves.
[tool.importlinter]
root_package = "trading"

[[tool.importlinter.contracts]]
name = "Layered architecture (L0–L6)"
type = "layers"
containers = ["trading"]
layers = [
    "cli | ui",
    "jobs",
    "llm",
    "paper | portfolio",
    "ranking",
    "backtest",
    "strategy",
    "features",
    "data",
    "store",
    "ops",
    "config | costs | domain | clock",
]
