[project]
name = "trading"
version = "0.1.0"
description = "AI-assisted trading & portfolio intelligence for the Indian market"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Sandeep Kumar" }]

dependencies = [
    # --- Data & numerics ---
    "pandas>=2.2",
    "polars>=0.20",
    "pyarrow>=15",
    "numpy>=1.26",
    "ta>=0.11.0",                # technical-indicator library (replaces unmaintained pandas-ta)

    # --- Sources ---
    "kiteconnect>=5.0",
    "yfinance>=0.2.40",
    "nsepython>=2.95",
    "feedparser>=6.0",
    "requests>=2.31",
    "requests-cache>=1.2",

    # --- ML / sentiment ---
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "transformers>=4.40",
    "torch>=2.2",

    # --- Backtest ---
    "vectorbt>=0.26",

    # --- LLM ---
    "anthropic>=0.40",

    # --- UI ---
    "streamlit>=1.35",
    "plotly>=5.20",

    # --- Utilities ---
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",
    "pydantic>=2.7",
]

[project.scripts]
trading = "trading.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "syrupy>=4.6",
    "freezegun>=1.5",
    "pandas-stubs",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "Research"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # asserts are fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict on src/trading, lax on tests
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/trading"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that hit live external APIs (Kite, news) — excluded from CI",
    "integration: end-to-end tests using cached fixtures",
    "slow: tests >5s — excluded from default run",
]
